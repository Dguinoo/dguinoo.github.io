<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/home-style new.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>404 - Page Not Found | Denzel Darick Guinoo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        #section_404 {
            box-sizing: border-box;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            padding: 2vh 4vw;
            gap: 1vh;
        }

        #section_404 img {
            max-height: 25vh;
            width: auto;
            max-width: 60vw;
            object-fit: contain;
        }

        #section_404 h1 {
            font-size: clamp(2.5rem, 8vh, 6rem);
            margin: 0;
            font-family: "Consolas", monospace;
            line-height: 1;
        }

        #section_404 p {
            font-size: clamp(1rem, 2.5vh, 1.5rem);
            margin: 0;
            font-family: "Consolas", monospace;
        }

        #section_404 button {
            margin-top: 1vh;
            font-family: "Consolas", monospace;
        }
    </style>
</head>
<body>
    <div id="LogoHome">
        <a href="index.html"><img src="Image/Nior Cat Logo.png" alt="Home"></a>
    </div>

    <div id="section_404">
        <img src="Image/404-image.png" alt="404 Not Found">
        <h1>404</h1>
        <p>Looks like this level hasn't been built yet.</p>
        <a href="index.html">
            <button class="Topbutton buttonViewProject">Back to Home</button>
        </a>
    </div>
</body>
</html>
